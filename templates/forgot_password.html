<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rakshak AI | Forgot Password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script>
        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
        }
    </script>
</head>
<body>
    <div class="background"></div>
    <div class="login-container">
        <div class="logo">
            <h1>RAKSHAK AI</h1>
            <p>Account Recovery</p>
        </div>
        <div class="login-card">
            <h2>Forgot Password</h2>
            <p class="subtitle">Enter your admin email to receive an OTP.</p>
            <form method="POST" action="/forgot_password">
                <div class="input-group">
                    <span class="icon"><i class="fa-solid fa-envelope"></i></span>
                    <input type="email" id="email" name="email" placeholder="Admin Email" required>
                </div>
                {% if error %}
                <div class="login-error">{{ error }}</div>
                {% endif %}
                <button type="submit"><i class="fa-solid fa-paper-plane"></i> SEND OTP</button>
                <div class="options" style="justify-content: center; margin-top: 15px;">
                    <a href="/">Back to Login</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
