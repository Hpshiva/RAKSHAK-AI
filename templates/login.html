<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rakshak AI | Login</title>
    <!-- Removed base.css to prevent conflict, only need login.css for this UI -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <!-- Using Inter font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <script>
        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
        }
    </script>
</head>

<body>

    <div class="background"></div>

    <div class="login-container">

        <div class="logo">
            <h1>RAKSHAK AI</h1>
            <p>Protecting Every Student, Every Second</p>
        </div>

        <div class="login-card">

            <h2>Welcome Back</h2>
            <p class="subtitle">
                Sign in to School Security Dashboard
            </p>

            <form id="loginForm" method="POST" action="/">

                <div class="input-group">
                    <span class="icon"><i class="fa-solid fa-id-card"></i></span>
                    <input type="email" id="email" name="email" placeholder="School Email" required>
                </div>

                <div class="input-group">
                    <span class="icon"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" id="password" name="password" placeholder="Password" required>
                    <span class="toggle-password" onclick="togglePassword()">
                        <i class="fa-solid fa-eye" id="togglePasswordIcon"></i>
                    </span>
                </div>

                <div class="options">
                    <label>
                        <input type="checkbox" name="remember">
                        Remember Me
                    </label>
                    <a href="/forgot_password">Forgot Password?</a>
                </div>

                {% if error|default %}
                <div class="login-error">
                    {{ error }}
                </div>
                {% endif %}

                <button type="submit" id="loginSubmitBtn">
                    <i class="fa-solid fa-right-to-bracket" id="loginSubmitIcon"></i>
                    <span id="loginSubmitText">ACCESS COMMAND CENTER</span>
                </button>

                <div class="security-badge">
                    <i class="fa-solid fa-shield-halved"></i>
                    Authorized Access Only
                </div>

                <div class="footer">
                    Powered by AI &bull; Robotics &bull; Computer Vision
                </div>

            </form>

        </div>

    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById("password");
            const toggleIcon = document.getElementById("togglePasswordIcon");
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                toggleIcon.classList.remove("fa-eye");
                toggleIcon.classList.add("fa-eye-slash");
            } else {
                passwordInput.type = "password";
                toggleIcon.classList.remove("fa-eye-slash");
                toggleIcon.classList.add("fa-eye");
            }
        }

        const loginForm = document.getElementById("loginForm");
        const loginSubmitBtn = document.getElementById("loginSubmitBtn");
        const loginSubmitIcon = document.getElementById("loginSubmitIcon");
        const loginSubmitText = document.getElementById("loginSubmitText");

        loginForm.addEventListener("submit", () => {
            loginSubmitBtn.disabled = true;
            loginSubmitBtn.classList.add("is-loading");
            loginSubmitIcon.className = "fa-solid fa-spinner fa-spin";
            loginSubmitText.textContent = "AUTHENTICATING...";
        });
    </script>
</body>

</html>
