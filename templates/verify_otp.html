<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rakshak AI | Verify OTP</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <div class="background"></div>
    <div class="login-container">
        <div class="logo">
            <h1>RAKSHAK AI</h1>
            <p>Account Recovery</p>
        </div>
        <div class="login-card">
            <h2>Enter OTP</h2>
            <p class="subtitle">Enter the 6-digit OTP sent to {{ email }}</p>
            <form method="POST" action="/verify_otp">
                <div class="input-group">
                    <span class="icon">🔑</span>
                    <input type="text" id="otp" name="otp" placeholder="6-Digit OTP" required pattern="\d{6}" maxlength="6">
                </div>
                {% if error %}
                <div class="login-error">{{ error }}</div>
                {% endif %}
                <button type="submit"><i class="fa-solid fa-check-circle"></i> VERIFY & LOGIN</button>
                <div class="options" style="justify-content: center; margin-top: 15px;">
                    <a href="/resend_otp">Resend OTP</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
