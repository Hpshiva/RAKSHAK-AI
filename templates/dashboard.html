<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rakshak AI - Multi-Camera Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #f8fafc;
            --panel-bg: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --accent-red: #ef4444;
            --accent-green: #22c55e;
            --accent-orange: #f97316;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            height: 100vh;
            overflow: hidden;
            transition: background-color 0.3s;
        }

        /* Critical alert background pulse */
        body.critical-alert {
            animation: pulse-red 2s infinite;
        }
        @keyframes pulse-red {
            0% { background-color: rgba(239, 68, 68, 0.2); }
            50% { background-color: rgba(239, 68, 68, 0.5); }
            100% { background-color: rgba(239, 68, 68, 0.2); }
        }

        /* Top navigation */
        .topbar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 100;
        }
        
        .topbar h1 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-primary);
        }

        /* Glass Button */
        .btn-glass {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 8px 18px;
            border-radius: 9999px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.7) 0%, rgba(255, 255, 255, 0.2) 100%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 
                0 4px 6px -1px rgba(0, 0, 0, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #1f2937;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .btn-glass:hover {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0.4) 100%);
            transform: translateY(-1px);
            box-shadow: 
                0 6px 8px -1px rgba(0, 0, 0, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 1);
        }

        .btn-glass:active {
            transform: translateY(1px);
            box-shadow: 
                0 1px 2px rgba(0, 0, 0, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 0.5);
        }

        /* Adjust glass button for dark background contexts (like video players) */
        .btn-glass.dark-context {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.05) 100%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #f8fafc;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.1);
        }
        
        .btn-glass.dark-context:hover {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0.1) 100%);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            margin-top: 60px;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Video Grid */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 20px;
        }

        .video-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
        }

        /* Fullscreen Overlay Button */
        .fullscreen-overlay-btn {
            position: absolute;
            bottom: 15px;
            right: 15px;
            background: rgba(20, 20, 20, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            cursor: pointer;
            z-index: 20;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .fullscreen-overlay-btn:hover {
            background: rgba(40, 40, 40, 0.85);
            transform: scale(1.05);
        }

        .video-header {
            padding: 12px 16px;
            background: #f8fafc;
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-red);
            border-radius: 50%;
            animation: pulse-dot 1.5s infinite;
        }

        @keyframes pulse-dot {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }

        .video-feed {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
            background: #000;
        }

        /* Sidebar Log */
        .sidebar {
            width: 320px;
            background: var(--panel-bg);
            border-left: 1px solid var(--border-color);
            margin-top: 60px;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .sidebar-header h2 {
            font-size: 1.1rem;
            margin-bottom: 10px;
        }

        .status-pill {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #fff;
            background: var(--accent-green);
            margin-bottom: 5px;
        }

        .status-pill.threat-HIGH { background: var(--accent-orange); }
        .status-pill.threat-CRITICAL { background: var(--accent-red); }

        .log-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .log-item {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
        }
        
        .log-time {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        
        .log-label {
            font-weight: 600;
        }

        .log-cam {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .log-threat-CRITICAL .log-label { color: var(--accent-red); }
        .log-threat-HIGH .log-label { color: var(--accent-orange); }

        /* Responsive Media Queries */
        @media (max-width: 992px) {
            .video-grid {
                grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            }
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
                overflow-y: auto;
            }
            .main-content {
                padding: 10px;
                overflow-y: visible;
                flex: none;
            }
            .sidebar {
                width: 100%;
                margin-top: 0;
                border-left: none;
                border-top: 1px solid var(--border-color);
            }
            .log-container {
                max-height: 400px;
            }
        }

        @media (max-width: 576px) {
            .video-grid {
                grid-template-columns: 1fr;
            }
            .topbar h1 {
                font-size: 1rem;
            }
            .logout-btn {
                padding: 6px 12px;
                font-size: 0.8rem;
            }
        }
        /* Glassy Toast Notification */
        .glass-toast {
            position: fixed;
            top: -100px; /* Hidden initially */
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            border-radius: 99px; /* Capsule shape */
            padding: 12px 20px 12px 12px;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 2000;
            transition: top 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            min-width: 340px;
        }

        .glass-toast.show {
            top: 20px;
        }

        .toast-icon {
            width: 40px;
            height: 40px;
            background: #ef4444; /* Red for alert */
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.2rem;
        }

        .toast-content {
            flex-grow: 1;
        }

        .toast-title {
            font-weight: 700;
            color: #1f2937;
            font-size: 0.95rem;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toast-time {
            font-weight: 400;
            color: #6b7280;
            font-size: 0.75rem;
        }

        .toast-message {
            color: #4b5563;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="topbar">
        <h1>RAKSHAK AI</h1>
        <div style="display: flex; gap: 10px;">
            <a href="/faces" class="btn-glass"><i class="fa-solid fa-users"></i> Known Faces</a>
            <a href="/about" class="btn-glass"><i class="fa-solid fa-circle-info"></i> About SOP</a>
            <a href="/logout" class="btn-glass">Log Out</a>
        </div>
    </div>

    <div class="main-content">
        <div class="video-grid">
            
            <!-- Dynamic Webcams will be injected here via JS -->
            <div id="dynamic-cameras-container" style="display: contents;"></div>

            <!-- Video Upload -->
            <div class="video-card" style="padding: 20px; display: flex; align-items: center; justify-content: center; background: #fff;">
                <form action="/upload_video" method="POST" enctype="multipart/form-data" style="text-align: center;">
                    <h3 style="margin-bottom: 15px; color: var(--text-primary);">Upload a Video for Analysis</h3>
                    <label class="btn-glass" style="cursor: pointer; display: inline-block;">
                        Browse Video
                        <input type="file" name="video_file" accept="video/mp4,video/x-m4v,video/*" required style="display: none;" onchange="this.form.submit()">
                    </label>
                </form>
            </div>

            {% if has_uploaded_video %}
            <div class="video-card">
                <div class="video-header" style="justify-content: space-between;">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <div class="live-dot" style="background:var(--accent-green)" id="uploaded-dot"></div>
                        Uploaded Video Analysis
                    </div>
                    <div style="display: flex; gap: 8px;">
                        <button onclick="closeVideo(this)" class="btn-glass" style="color: var(--accent-red); font-size: 0.8rem; padding: 6px 12px;">Close</button>
                    </div>
                </div>
                <div class="video-container" style="position: relative; width: 100%; aspect-ratio: 16/9; background: #000; display: flex; flex-direction: column; overflow: hidden;">
                    <img src="/uploaded_video_feed" class="video-feed" alt="Uploaded Video Feed" style="flex: 1; min-height: 0; object-fit: contain; width: 100%;">
                    
                    <!-- Controls Container -->
                    <div style="background: rgba(0,0,0,0.85); border-top: 1px solid #333; z-index: 10; display: flex; flex-direction: column;">
                        
                        <!-- Progress Bar -->
                        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 15px 4px 15px; color: white; font-size: 0.85rem; font-family: monospace;">
                            <span id="current-time">0:00</span>
                            <input type="range" id="video-progress" style="flex: 1; accent-color: var(--accent-red); cursor: pointer; height: 4px;" min="0" max="100" value="0" step="0.1">
                            <span id="total-time">0:00</span>
                        </div>
                        
                        <!-- Play/Seek Controls -->
                        <div style="padding: 8px 12px 12px 12px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;">
                            <div></div> <!-- Left spacer -->
                            
                            <div style="display: flex; justify-content: center; gap: 15px;">
                                <button onclick="controlVideo('seek/-5')" class="btn-glass dark-context"><i class="fa-solid fa-backward"></i></button>
                                <button onclick="controlVideo('play')" id="play-btn" class="btn-glass dark-context" style="display: none;"><i class="fa-solid fa-play"></i></button>
                                <button onclick="controlVideo('pause')" id="pause-btn" class="btn-glass dark-context"><i class="fa-solid fa-pause"></i></button>
                                <button onclick="controlVideo('seek/5')" class="btn-glass dark-context"><i class="fa-solid fa-forward"></i></button>
                            </div>
                            
                            <div style="display: flex; justify-content: flex-end;">
                                <button onclick="toggleFullscreen(this)" class="btn-glass dark-context" title="Full screen (F)" style="padding: 6px 10px; display: flex; align-items: center; justify-content: center;">
                                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                        <polyline points="15 3 21 3 21 9"></polyline>
                                        <line x1="14" y1="10" x2="21" y2="3"></line>
                                        <polyline points="9 21 3 21 3 15"></polyline>
                                        <line x1="10" y1="14" x2="3" y2="21"></line>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            {% endif %}

        </div>
    </div>

    <div class="sidebar">
        <div class="sidebar-header">
            <h2>System Status</h2>
            <div id="system-threat" class="status-pill">System Normal</div>
            <div style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 5px;">
                Total People: <span id="system-people">0</span>
            </div>
        </div>
        <div class="log-container" id="log-container">
            <!-- Logs will be injected here -->
        </div>
    </div>

    <!-- Glassy Toast Notification -->
    <div id="screenshotToast" class="glass-toast">
        <div class="toast-icon">
            <i class="fa-solid fa-crop-simple"></i>
        </div>
        <div class="toast-content">
            <div class="toast-title">Screenshot saved <span class="toast-time" id="toastTime">Just now</span></div>
            <div class="toast-message">Tap here to see your screenshot.</div>
        </div>
        <div>
            <i class="fa-solid fa-chevron-down" style="color: #9ca3af; font-size: 0.8rem;"></i>
        </div>
    </div>

    <script>
        let previousScreenshotTime = null;

        function showScreenshotToast() {
            const toast = document.getElementById('screenshotToast');
            const timeEl = document.getElementById('toastTime');
            
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'pm' : 'am';
            hours = hours % 12;
            hours = hours ? hours : 12; 
            minutes = minutes < 10 ? '0' + minutes : minutes;
            timeEl.textContent = `${hours}:${minutes} ${ampm}`;
            
            toast.classList.add('show');
            
            // Hide after 5 seconds
            setTimeout(() => {
                toast.classList.remove('show');
            }, 5000);
        }

        // Initialize Dynamic Cameras
        async function loadCameras() {
            try {
                const res = await fetch('/api/cameras');
                const data = await res.json();
                const container = document.getElementById('dynamic-cameras-container');
                
                data.cameras.forEach(camId => {
                    const card = document.createElement('div');
                    card.className = 'video-card';
                    card.innerHTML = `
                        <div class="video-header" style="justify-content: space-between;">
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <div class="live-dot" id="webcam-dot-${camId}"></div>
                                Webcam ${camId} (Live)
                            </div>
                            <div style="display: flex; gap: 8px;">
                                <button onclick="toggleWebcam(this, ${camId})" class="btn-glass" style="font-size: 0.8rem; padding: 6px 12px;">Turn Off</button>
                            </div>
                        </div>
                        <div class="video-container" style="position: relative; width: 100%; aspect-ratio: 16/9; background: #000; display: flex; flex-direction: column; overflow: hidden;">
                            <img src="/camera_feed/${camId}" class="video-feed" alt="Webcam ${camId}" style="width: 100%; height: 100%; object-fit: cover;">
                            
                            <button onclick="toggleFullscreen(this)" class="fullscreen-overlay-btn" title="Full screen (F)">
                                <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="15 3 21 3 21 9"></polyline>
                                    <line x1="14" y1="10" x2="21" y2="3"></line>
                                    <polyline points="9 21 3 21 3 15"></polyline>
                                    <line x1="10" y1="14" x2="3" y2="21"></line>
                                </svg>
                            </button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                console.error("Failed to load cameras", err);
            }
        }
        
        loadCameras();

        // Advanced Video Controls
        async function toggleWebcam(btn, camId) {
            const res = await fetch('/api/toggle_webcam', { 
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ camera_id: camId })
            });
            const data = await res.json();
            if (data.webcam_enabled) {
                btn.textContent = "Turn Off";
                document.getElementById('webcam-dot-' + camId).style.display = 'block';
            } else {
                btn.textContent = "Turn On";
                document.getElementById('webcam-dot-' + camId).style.display = 'none';
            }
        }

        async function controlVideo(action) {
            await fetch('/api/video/' + action, { method: 'POST' });
            if (action === 'play') {
                document.getElementById('play-btn').style.display = 'none';
                document.getElementById('pause-btn').style.display = 'block';
                document.getElementById('uploaded-dot').style.display = 'block';
            } else if (action === 'pause') {
                document.getElementById('play-btn').style.display = 'block';
                document.getElementById('pause-btn').style.display = 'none';
                document.getElementById('uploaded-dot').style.display = 'none';
            }
        }

        async function closeVideo(btn) {
            await fetch('/api/video/close', { method: 'POST' });
            btn.closest('.video-card').style.display = 'none';
        }

        // Progress Bar Logic
        let isDraggingProgress = false;
        const progressSlider = document.getElementById('video-progress');
        const currentTimeSpan = document.getElementById('current-time');
        const totalTimeSpan = document.getElementById('total-time');

        function formatTime(seconds) {
            if (isNaN(seconds) || seconds < 0) return "0:00";
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        if (progressSlider) {
            progressSlider.addEventListener('mousedown', () => isDraggingProgress = true);
            progressSlider.addEventListener('input', (e) => {
                currentTimeSpan.textContent = formatTime(e.target.value);
            });
            progressSlider.addEventListener('change', async (e) => {
                await fetch('/api/video_seek_absolute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ time: e.target.value })
                });
                isDraggingProgress = false;
            });
            
            // Poll for progress
            setInterval(async () => {
                if (isDraggingProgress) return;
                try {
                    const res = await fetch('/api/video_progress');
                    const data = await res.json();
                    if (!isDraggingProgress && data.total > 0) {
                        progressSlider.max = data.total;
                        progressSlider.value = data.current;
                        currentTimeSpan.textContent = formatTime(data.current);
                        totalTimeSpan.textContent = formatTime(data.total);
                    }
                } catch (e) {}
            }, 500);
        }

        function toggleFullscreen(btn) {
            const container = btn.closest('.video-card').querySelector('.video-container');
            if (!document.fullscreenElement) {
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                } else if (container.msRequestFullscreen) {
                    container.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        }

        // Global 'f' key shortcut for fullscreen
        let hoveredVideoContainer = null;

        document.addEventListener('mouseover', (e) => {
            const card = e.target.closest('.video-card');
            if (card) {
                hoveredVideoContainer = card.querySelector('.video-container');
            } else {
                hoveredVideoContainer = null;
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'f') {
                // Ignore if user is typing in an input
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

                if (!document.fullscreenElement) {
                    // Fullscreen the hovered video, or the entire page if none hovered
                    const container = hoveredVideoContainer || document.documentElement;
                    if (container.requestFullscreen) {
                        container.requestFullscreen();
                    } else if (container.webkitRequestFullscreen) {
                        container.webkitRequestFullscreen();
                    } else if (container.msRequestFullscreen) {
                        container.msRequestFullscreen();
                    }
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) {
                        document.webkitExitFullscreen();
                    } else if (document.msExitFullscreen) {
                        document.msExitFullscreen();
                    }
                }
            }
        });

        // Update Detections Log
        async function fetchDetections() {
            try {
                const response = await fetch('/detections');
                const data = await response.json();
                
                const logContainer = document.getElementById('log-container');
                logContainer.innerHTML = '';
                
                data.forEach(item => {
                    const log = document.createElement('div');
                    log.className = `log-item log-threat-${item.threat}`;
                    
                    log.innerHTML = `
                        <div class="log-time">${item.time}</div>
                        <div class="log-label">${item.label} (${item.confidence}%)</div>
                        <div class="log-cam">${item.camera}</div>
                    `;
                    logContainer.appendChild(log);
                });
            } catch (err) {
                console.error("Error fetching logs", err);
            }
        }

        // Update System Status
        async function fetchStatus() {
            try {
                const response = await fetch('/robot_status');
                const data = await response.json();
                
                // Screenshot Toast Logic
                if (data.last_screenshot_time) {
                    if (previousScreenshotTime !== null && data.last_screenshot_time > previousScreenshotTime) {
                        showScreenshotToast();
                    }
                    previousScreenshotTime = data.last_screenshot_time;
                }
                
                document.getElementById('system-people').textContent = data.people;
                
                const threatPill = document.getElementById('system-threat');
                threatPill.className = `status-pill threat-${data.threat}`;
                threatPill.textContent = data.threat === 'LOW' ? 'System Normal' : `Threat Level: ${data.threat}`;
                
                if (data.threat === 'CRITICAL') {
                    document.body.classList.add('critical-alert');
                } else {
                    document.body.classList.remove('critical-alert');
                }
                
            } catch (err) {
                console.error("Error fetching status", err);
            }
        }

        // Poll every 1 second
        setInterval(() => {
            fetchDetections();
            fetchStatus();
        }, 1000);
        
        // Initial fetch
        fetchDetections();
        fetchStatus();
    </script>
</body>
</html>
